# Podman Compose (and Docker Compose v2) stack for CosyVoice TTS
#
#   podman compose up -d
#   podman compose down
#
# Ports:
#   27755  FastAPI (TTS API + /health)
#   27756  Static web UI (web/)
#
# Apple Silicon: forces linux/arm64 (Podman machine VM).

name: cosyvoice-tts

services:
  tts:
    image: cosyvoice-tts:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosyvoice-tts
    platform: linux/arm64
    ports:
      - "27755:27755"
      - "27756:27756"
    environment:
      HOST: "0.0.0.0"
      PORT: "27755"
      UI_PORT: "27756"
      UI_ENABLED: "true"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      TTS_ENGINE: "${TTS_ENGINE:-cosyvoice}"
      DEVICE: "${DEVICE:-cpu}"
      # Model selection — change without rebuilding the image
      MODEL_NAME: "${MODEL_NAME:-ASLP-lab/Cosyvoice2-Yue-ZoengJyutGaai}"
      COSYVOICE_MODEL: "${COSYVOICE_MODEL:-}"
      MODEL_LOCAL_NAME: "${MODEL_LOCAL_NAME:-Cosyvoice2-Yue-ZoengJyutGaai}"
      MODEL_DIR: /models
      OUTPUT_DIR: /output
      INPUT_DIR: /input
      CACHE_DIR: /cache
      DEFAULT_LANGUAGE: "${DEFAULT_LANGUAGE:-yue}"
      DEFAULT_SPEAKER: "${DEFAULT_SPEAKER:-default}"
      OUTPUT_FORMAT: "${OUTPUT_FORMAT:-wav}"
      MAX_CHARS_PER_CHUNK: "${MAX_CHARS_PER_CHUNK:-200}"
      DOWNLOAD_SOURCE: "${DOWNLOAD_SOURCE:-huggingface}"
      HF_TOKEN: "${HF_TOKEN:-}"
      SKIP_MODEL_DOWNLOAD: "${SKIP_MODEL_DOWNLOAD:-false}"
      MODELSCOPE_CACHE: /cache/modelscope
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-1}"
      MKL_NUM_THREADS: "${MKL_NUM_THREADS:-1}"
      # Limit glibc arenas — reduces RSS growth under multi-thread torch on CPU
      MALLOC_ARENA_MAX: "${MALLOC_ARENA_MAX:-2}"
      # Stream CosyVoice token2wav windows (lower peak RSS on 16GB hosts)
      COSYVOICE_STREAM: "${COSYVOICE_STREAM:-true}"
      # Avoid torch SVE / i8mm kernels that SIGILL under Apple Virtualization
      GLIBC_TUNABLES: "${GLIBC_TUNABLES:-glibc.cpu.hwcaps=-SVE,-SVE2,-I8MM,-BF16}"
      ATEN_CPU_CAPABILITY: "${ATEN_CPU_CAPABILITY:-default}"
      TRANSFORMERS_ATTENTION_IMPLEMENTATION: "${TRANSFORMERS_ATTENTION_IMPLEMENTATION:-eager}"
      PYTHONFAULTHANDLER: "1"
    volumes:
      - tts-models:/models
      - tts-output:/output
      - tts-input:/input
      - tts-cache:/cache
    restart: unless-stopped
    # CosyVoice CPU: ~8GB resident after load; first inference can spike higher.
    # On a 16GB Mac leave headroom for macOS (e.g. podman machine set --memory 12288).
    # If TTS dies mid-request, check OOMKilled and consider more RAM or VM swap.
    mem_limit: 11g
    shm_size: "1g"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:27755/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  tts-models:
    name: cosyvoice-tts-models
  tts-output:
    name: cosyvoice-tts-output
  tts-input:
    name: cosyvoice-tts-input
  tts-cache:
    name: cosyvoice-tts-cache
